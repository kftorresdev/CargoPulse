services:
  db:
    image: postgres:16-alpine
    container_name: cargopulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cargopulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cargopulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cargopulse-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cargopulse-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cargopulse?schema=public
      JWT_SECRET: cargopulse-enterprise-jwt-super-secret-key-2026-production
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cargopulse-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cargopulse-web
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - cargopulse-network

volumes:
  pgdata:

networks:
  cargopulse-network:
    driver: bridge
