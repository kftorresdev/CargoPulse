name: CargoPulse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/api/package-lock.json'

      - name: Install API dependencies
        run: npm ci --prefix apps/api

      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Run TypeScript / NestJS build
        run: npm run build --prefix apps/api

      - name: Run Vitest unit tests
        run: npm test --prefix apps/api

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Web dependencies
        run: npm ci --prefix apps/web

      - name: Run Angular production build
        run: npm run build --prefix apps/web

      - name: Run Vitest / Angular unit tests
        run: npm test --prefix apps/web -- --watch=false

  e2e-playwright:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root and apps dependencies
        run: |
          npm ci
          npm ci --prefix apps/api
          npm ci --prefix apps/web
          npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build API and Web
        run: |
          npm run build --prefix apps/api
          npm run build --prefix apps/web

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
