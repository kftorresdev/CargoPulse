name: CargoPulse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/api/package-lock.json'

      - name: Install API dependencies
        run: npm ci --prefix apps/api

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Run TypeScript / NestJS build
        run: npm run build --prefix apps/api

      - name: Run Vitest unit tests
        run: npm test --prefix apps/api

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Web dependencies
        run: npm ci --prefix apps/web

      - name: Run Angular production build
        run: npm run build --prefix apps/web

      - name: Run Vitest / Angular unit tests
        run: npm test --prefix apps/web -- --watch=false

  e2e-playwright:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root and apps dependencies
        run: |
          npm ci
          npm ci --prefix apps/api
          npm ci --prefix apps/web
          cd apps/api && npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build API and Web
        run: |
          npm run build --prefix apps/api
          npm run build --prefix apps/web

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Web dependencies
        run: npm ci --prefix apps/web

      - name: Build Angular for GitHub Pages
        run: |
          npm run build --prefix apps/web -- --base-href /CargoPulse/
          cp apps/web/dist/web/browser/index.html apps/web/dist/web/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/web/dist/web/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
